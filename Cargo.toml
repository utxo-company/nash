[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
homepage = "https://nash-script.dev"
repository = "https://github.com/nash-script/compiler"
license = "Apache-2.0"

[workspace.dependencies]
bumpalo = { version = "3.19.1", features = ["collections"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
